<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FounderOS Mobile PWA v1.0</title>
<style>
:root{
  --bg:#07111f;--panel:#0d1b2e;--panel2:#13263d;--ink:#eaf2ff;--muted:#8fa9c7;
  --line:#24415f;--accent:#38bdf8;--accent2:#7dd3fc;--good:#34d399;--warn:#fbbf24;--bad:#fb7185;
  --shadow:0 12px 30px rgba(0,0,0,.35);--radius:18px;
}
[data-theme="light"]{
  --bg:#f5f8fc;--panel:#ffffff;--panel2:#e9f1fb;--ink:#0a1628;--muted:#55708e;
  --line:#c9d9ea;--accent:#0369a1;--accent2:#0284c7;--shadow:0 10px 24px rgba(16,40,70,.12);
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:920px;margin:0 auto;padding:14px 14px 92px}.top{position:sticky;top:0;z-index:8;background:linear-gradient(180deg,var(--bg),rgba(7,17,31,.88));backdrop-filter:blur(10px);padding:12px 0 10px}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#1e3a8a);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:900}.h1{font-size:1.25rem;font-weight:900;letter-spacing:.2px}.sub{font-size:.76rem;color:var(--muted);margin-top:2px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:14px;padding:10px 12px;font-weight:800;cursor:pointer}.btn:active{transform:scale(.98)}.btn.primary{background:linear-gradient(135deg,var(--accent),#2563eb);border-color:transparent;color:white}.btn.good{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.45)}.btn.warn{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.44)}.btn.bad{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.44)}
.grid{display:grid;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:16px 0 9px}.sectionTitle h2{font-size:1rem;margin:0}.muted{color:var(--muted)}.small{font-size:.78rem}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(7,17,31,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.tabwrap{max-width:920px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tab{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:13px;padding:8px 4px;font-weight:800;font-size:.72rem}.tab.active{background:var(--panel2);color:var(--ink);border-color:var(--line)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:14px;padding:11px;font:inherit;outline:none} textarea{min-height:92px;resize:vertical}.field label{display:block;color:var(--muted);font-size:.75rem;font-weight:800;margin:0 0 5px 3px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quick .btn{text-align:left;min-height:44px}.card{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:16px;padding:12px}.card h3{margin:0 0 6px;font-size:.98rem}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:5px 8px;font-size:.72rem;font-weight:800;color:var(--muted)}.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}.metric b{display:block;font-size:1.35rem}.list{display:grid;gap:9px}.hidden{display:none!important}.right{margin-left:auto}.dangerZone{border-color:rgba(251,113,133,.45)}
.swipeActions{display:flex;gap:8px;margin-top:10px}.status-dot{width:9px;height:9px;border-radius:99px;background:var(--accent);display:inline-block}.status-dot.good{background:var(--good)}.status-dot.warn{background:var(--warn)}.status-dot.bad{background:var(--bad)}
@media(min-width:760px){.desktop2{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.quick{grid-template-columns:repeat(4,1fr)}}
</style>

<meta name="theme-color" content="#07111f" />
<meta name="description" content="FounderOS Mobile: AI-first startup command center for products, agents, revenue paths, theses, experiments, and daily briefs." />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FounderOS" />
</head>
<body>
<div class="app" id="app" data-theme="dark">
  <div class="top">
    <div class="brand">
      <div class="logo"><div class="mark">F</div><div><div class="h1">FounderOS Mobile</div><div class="sub">AI-first startup command center · PWA v1.0</div></div></div>
      <button class="btn" id="themeBtn">☀︎</button>
    </div>
  </div>

  <main id="view"></main>
</div>
<nav class="tabs"><div class="tabwrap">
  <button class="tab active" data-tab="capture">Capture</button>
  <button class="tab" data-tab="agents">Agents</button>
  <button class="tab" data-tab="products">Products</button>
  <button class="tab" data-tab="revenue">Revenue</button>
  <button class="tab" data-tab="brief">Brief</button>
</div></nav>
<script>
const KEY='founderos_mobile_v1';
const nowISO=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const starter={
  theme:'dark', active:'capture',
  agents:[
    {id:uid(),name:'CEO Agent',focus:'Portfolio priority, strategic sequencing, weekly decision-making',status:'Active'},
    {id:uid(),name:'Product Agent',focus:'Specs, feature ranking, app improvements',status:'Active'},
    {id:uid(),name:'Monetization Agent',focus:'Pricing, SaaS paths, licensing, revenue tests',status:'Active'},
    {id:uid(),name:'Marketing Agent',focus:'Positioning, content, launch assets, distribution',status:'Active'},
    {id:uid(),name:'Customer Discovery Agent',focus:'Personas, interviews, outreach lists, pain validation',status:'Queued'},
    {id:uid(),name:'Engineering Agent',focus:'Implementation plans, bugs, refactors, deployment',status:'Active'},
    {id:uid(),name:'Narrative Strategy Agent',focus:'Convert reflections into theses, experiments, and operating doctrine',status:'Active'}
  ],
  products:[
    {id:uid(),name:'Executive OS / Life Vitals',category:'Personal Operating System',status:'Flagship candidate',target:'High-agency individuals tracking life systems',monetization:'Subscription / coaching / licensing',next:'Define flagship landing page'},
    {id:uid(),name:'Communication Meter',category:'Relationship / Executive OS',status:'High-value wedge',target:'Couples, therapists, executives, high-volume communicators',monetization:'Subscription / coaching / clinical-adjacent licensing',next:'Package screenshots + use case story'},
    {id:uid(),name:'Helio Clock',category:'Time OS',status:'Standalone utility',target:'Sunlight, time, travel, outdoor users',monetization:'Paid store app / premium utility',next:'Polish Microsoft Store listing'},
    {id:uid(),name:'Trading Tools Suite',category:'Market OS',status:'Niche specialist',target:'Microcap biotech traders',monetization:'Paid templates / pro toolkit / newsletter companion',next:'Bundle tools into one market workflow'}
  ],
  revenuePaths:[
    {id:uid(),name:'Direct SaaS',fit:'Executive OS, Life Vitals, Communication Meter',price:'$5–$20/mo',status:'Evaluate'},
    {id:uid(),name:'Paid App Store Utility',fit:'Helio Clock, calculators, focused utilities',price:'$4.99–$29.99',status:'Ready'},
    {id:uid(),name:'Coaching + Software',fit:'Executive OS implementation, personal systems consulting',price:'$500–$5,000 package',status:'Promising'},
    {id:uid(),name:'Enterprise / Institutional Licensing',fit:'Communication workflows, performance dashboards, student/professional OS',price:'$5k–$50k+',status:'Longer-term'},
    {id:uid(),name:'White Label',fit:'Universities, creators, consultants, clinics, teams',price:'Project-based',status:'Explore'}
  ],
  entries:[], tasks:[], theses:[
    {id:uid(),title:'AI-first execution may outperform network-first execution',evidence:'Mobile workflow, agent leverage, existing app portfolio, independent production capacity.',counter:'Distribution and trust may still require targeted relationships.',next:'Run one AI-first revenue experiment before leaning on network.',status:'Testing',createdAt:nowISO()}
  ], experiments:[]
};
let db=load();
function load(){try{return {...starter,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return starter}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function byId(arr,id){return arr.find(x=>x.id===id)}
function setTab(t){db.active=t;save();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.getElementById('themeBtn').onclick=()=>{db.theme=db.theme==='dark'?'light':'dark';save();applyTheme()};
function applyTheme(){document.getElementById('app').dataset.theme=db.theme;document.getElementById('themeBtn').textContent=db.theme==='dark'?'☀︎':'☾'}
function optionList(arr, selected){return `<option value="">None</option>`+arr.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name||x.title)}</option>`).join('')}
function captureView(){return `<div class="sectionTitle"><h2>Fast Capture</h2><span class="pill">phone-first</span></div>
<div class="desktop2"><section class="panel">
 <div class="quick">
 ${['New idea','App update','Monetization idea','Marketing idea','Customer/persona','Bug/fix','Agent task','Narrative reflection'].map(x=>`<button class="btn" onclick="quickType('${x}')">${x}</button>`).join('')}
 </div><br>
 <div class="field"><label>Capture</label><textarea id="entryText" placeholder="Speak or type the thought. Example: AI-first methodology may be the best financial play..."></textarea></div>
 <div class="two"><div class="field"><label>Type</label><select id="entryType"><option>New idea</option><option>App update</option><option>Monetization idea</option><option>Marketing idea</option><option>Customer/persona</option><option>Bug/fix</option><option>Agent task</option><option>Narrative reflection</option></select></div>
 <div class="field"><label>Product</label><select id="entryProduct">${optionList(db.products)}</select></div></div>
 <div class="two"><div class="field"><label>Agent</label><select id="entryAgent">${optionList(db.agents)}</select></div><div class="field"><label>Convert to</label><select id="entryConvert"><option>Entry only</option><option>Task</option><option>Thesis</option><option>Experiment</option></select></div></div>
 <button class="btn primary" onclick="saveEntry()">Save Capture</button>
</section><section class="panel"><h2 style="margin-top:0">Recent Captures</h2><div class="list">${db.entries.slice(-5).reverse().map(entryCard).join('')||'<p class="muted">No captures yet.</p>'}</div></section></div>`}
function entryCard(e){let p=byId(db.products,e.productId), a=byId(db.agents,e.agentId);return `<div class="card"><div class="row"><span class="pill">${esc(e.type)}</span><span class="pill">${new Date(e.createdAt).toLocaleString()}</span></div><p>${esc(e.text)}</p><div class="row small muted">${p?esc(p.name):'No product'} · ${a?esc(a.name):'No agent'}</div></div>`}
function agentsView(){return `<div class="sectionTitle"><h2>Agent Team</h2><button class="btn" onclick="addAgent()">+ Agent</button></div><div class="list">${db.agents.map(a=>`<div class="card"><div class="row"><h3>${esc(a.name)}</h3><span class="right pill"><span class="status-dot ${a.status==='Active'?'good':'warn'}"></span>${esc(a.status)}</span></div><p class="muted">${esc(a.focus)}</p><div class="swipeActions"><button class="btn" onclick="agentPrompt('${a.id}')">Prompt</button><button class="btn warn" onclick="editAgent('${a.id}')">Edit</button></div></div>`).join('')}</div>`}
function productsView(){return `<div class="sectionTitle"><h2>Product Portfolio</h2><button class="btn" onclick="addProduct()">+ Product</button></div><div class="list">${db.products.map(p=>`<div class="card"><div class="row"><h3>${esc(p.name)}</h3><span class="right pill">${esc(p.status)}</span></div><p class="muted">${esc(p.category)} · ${esc(p.target)}</p><p><b>Monetization:</b> ${esc(p.monetization)}</p><p><b>Next:</b> ${esc(p.next)}</p><button class="btn warn" onclick="editProduct('${p.id}')">Edit</button></div>`).join('')}</div>`}
function revenueView(){return `<div class="sectionTitle"><h2>Revenue Paths</h2><button class="btn" onclick="addRevenue()">+ Path</button></div><div class="list">${db.revenuePaths.map(r=>`<div class="card"><div class="row"><h3>${esc(r.name)}</h3><span class="right pill">${esc(r.status)}</span></div><p><b>Fit:</b> ${esc(r.fit)}</p><p><b>Price:</b> ${esc(r.price)}</p></div>`).join('')}</div><div class="sectionTitle"><h2>Theses</h2><button class="btn" onclick="addThesis()">+ Thesis</button></div><div class="list">${db.theses.map(t=>`<div class="card"><div class="row"><h3>${esc(t.title)}</h3><span class="right pill">${esc(t.status)}</span></div><p><b>Evidence:</b> ${esc(t.evidence)}</p><p><b>Counter:</b> ${esc(t.counter)}</p><p><b>Next:</b> ${esc(t.next)}</p></div>`).join('')}</div>`}
function briefView(){const open=db.tasks.filter(t=>t.status!=='Done');return `<div class="sectionTitle"><h2>Daily Startup Brief</h2><button class="btn primary" onclick="generateBrief()">Generate Brief</button></div><div class="three"><div class="metric"><b>${db.products.length}</b><span class="muted">Products</span></div><div class="metric"><b>${db.entries.length}</b><span class="muted">Captures</span></div><div class="metric"><b>${open.length}</b><span class="muted">Open Tasks</span></div></div><br><div class="panel" id="briefBox">${db.brief?db.brief:'<p class="muted">Tap Generate Brief for today’s priorities.</p>'}</div><br><div class="panel"><h2 style="margin-top:0">Data</h2><div class="row"><button class="btn" onclick="exportJSON()">Export JSON</button><button class="btn" onclick="exportCSV()">Export CSV</button><label class="btn">Import JSON<input type="file" accept="application/json" class="hidden" onchange="importJSON(event)"></label><button class="btn bad" onclick="resetAll()">Reset</button></div></div>`}
function render(){applyTheme();let v=document.getElementById('view');v.innerHTML=({capture:captureView,agents:agentsView,products:productsView,revenue:revenueView,brief:briefView}[db.active]||captureView)()}
function quickType(t){document.getElementById('entryType').value=t;document.getElementById('entryText').focus()}
function saveEntry(){let text=document.getElementById('entryText').value.trim(); if(!text) return alert('Add capture text.'); let e={id:uid(),text,type:document.getElementById('entryType').value,productId:document.getElementById('entryProduct').value,agentId:document.getElementById('entryAgent').value,createdAt:nowISO()}; db.entries.push(e); let c=document.getElementById('entryConvert').value; if(c==='Task')db.tasks.push({id:uid(),title:text.slice(0,90),entryId:e.id,status:'Open',createdAt:nowISO()}); if(c==='Thesis')db.theses.push({id:uid(),title:text.slice(0,110),evidence:'Captured insight needs evidence.',counter:'Identify counter-evidence.',next:'Design a small test.',status:'Testing',createdAt:nowISO()}); if(c==='Experiment')db.experiments.push({id:uid(),title:text.slice(0,110),hypothesis:text,metric:'Revenue / feedback / completion',status:'Planned',createdAt:nowISO()}); save();render();}
function addAgent(){let name=prompt('Agent name'); if(!name)return; let focus=prompt('Agent focus')||''; db.agents.push({id:uid(),name,focus,status:'Queued'});save();render()}
function editAgent(id){let a=byId(db.agents,id); a.focus=prompt('Focus',a.focus)||a.focus; a.status=prompt('Status',a.status)||a.status;save();render()}
function agentPrompt(id){let a=byId(db.agents,id); navigator.clipboard?.writeText(`Act as ${a.name} for FounderOS Mobile. Focus: ${a.focus}. Review the product portfolio, recent captures, theses, and revenue paths. Produce prioritized next actions for the next 24 hours.`); alert('Agent prompt copied to clipboard.');}
function addProduct(){let name=prompt('Product name'); if(!name)return; db.products.push({id:uid(),name,category:prompt('Category')||'',status:'New',target:prompt('Target user')||'',monetization:prompt('Monetization path')||'',next:prompt('Next action')||''});save();render()}
function editProduct(id){let p=byId(db.products,id); ['category','status','target','monetization','next'].forEach(k=>p[k]=prompt(k,p[k])||p[k]);save();render()}
function addRevenue(){let name=prompt('Revenue path'); if(!name)return; db.revenuePaths.push({id:uid(),name,fit:prompt('Fit')||'',price:prompt('Price')||'',status:'Explore'});save();render()}
function addThesis(){let title=prompt('Thesis'); if(!title)return; db.theses.push({id:uid(),title,evidence:prompt('Evidence')||'',counter:prompt('Counter-evidence')||'',next:prompt('Next experiment')||'',status:'Testing',createdAt:nowISO()});save();render()}
function generateBrief(){let products=db.products.slice(0,3).map(p=>`<li><b>${esc(p.name)}</b>: ${esc(p.next||'Define next action')}</li>`).join('');let thesis=db.theses[db.theses.length-1];db.brief=`<h3>${new Date().toLocaleDateString()} Brief</h3><p><b>Build today:</b> advance the highest-confidence product wedge.</p><ul>${products}</ul><p><b>Market today:</b> publish one proof-of-use artifact from your actual workflow.</p><p><b>Monetize today:</b> convert one app into a named offer with price, buyer, and next action.</p><p><b>Current thesis:</b> ${esc(thesis?.title||'No thesis yet.')}</p><p><b>Ignore today:</b> broad networking without a defined ask, offer, or experiment.</p>`;save();render()}
function exportJSON(){download('founderos_mobile_export.json',JSON.stringify(db,null,2),'application/json')}
function exportCSV(){let rows=[['createdAt','type','text','product','agent']].concat(db.entries.map(e=>[e.createdAt,e.type,e.text,byId(db.products,e.productId)?.name||'',byId(db.agents,e.agentId)?.name||'']));download('founderos_entries.csv',rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function importJSON(ev){let f=ev.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{db=JSON.parse(r.result);save();render()}catch(e){alert('Invalid JSON')}}; r.readAsText(f)}
function resetAll(){if(confirm('Reset all FounderOS data?')){localStorage.removeItem(KEY);db=starter;save();render()}}
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker registration failed', err));
  });
}

</script>
</body>
</html>
